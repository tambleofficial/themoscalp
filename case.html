<!DOCTYPE html>
<html lang="ko">
<head>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CASE — THE MO SCALP</title>
<meta name="description" content="실제 작업 사례 아카이브. 시작 상태부터 작업 범위까지 같은 비율로 기록합니다.">
<link rel="canonical" href="https://themoscalp.pages.dev/case">
<meta property="og:type" content="website">
<meta property="og:site_name" content="THE MO SCALP">
<meta property="og:title" content="CASE — THE MO SCALP">
<meta property="og:description" content="실제 작업 사례 아카이브. 시작 상태부터 작업 범위까지 같은 비율로 기록합니다.">
<meta property="og:url" content="https://themoscalp.pages.dev/case">
<meta property="og:image" content="https://themoscalp.pages.dev/og-image.jpg">
<meta property="og:locale" content="ko_KR">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#090909">
<link rel="alternate" type="application/rss+xml" title="THE MO SCALP" href="https://themoscalp.pages.dev/rss.xml">

<script src="/assets/sj-cms.js?v=1"></script>
<script src="./slots.js?v=1"></script>
<script src="./support.js"></script>
<link rel="stylesheet" href="/assets/tms-m.css?v=1">
<script src="/assets/tms-fit.js?v=1" defer></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style data-mobile="1">@media (max-width:760px){html,body{overflow-x:hidden}[data-m=flow]{min-width:0!important}[data-m=line]{display:none!important}[data-m=row]{display:grid!important;grid-template-columns:1fr 1fr!important;gap:44px 16px!important}[data-m=row]>*{flex:auto!important;width:auto!important;min-width:0!important;padding-left:0!important;padding-right:0!important;border-left:0!important}[data-m=tones]{flex-direction:column!important;height:auto!important}[data-m=tones]>div{flex:none!important;height:64px}[data-m=tones]>div[data-active="1"]{height:600px}[data-m=vlabel]{writing-mode:horizontal-tb!important;transform:none!important;bottom:auto!important;top:24px!important}[data-m=tablet]{aspect-ratio:auto!important;min-height:540px!important;border-radius:24px!important;padding:10px!important}[data-m=unstick]{position:static!important}[data-m=gal]{grid-template-columns:1fr 1fr!important;grid-auto-rows:44vw!important}[data-m=gal]>*:first-child{grid-column:1 / -1!important}[data-m=hide-m]{display:none!important}[data-m=wrap]{white-space:normal!important}}</style>
  <style>
    html,body{margin:0;background:#090909;color:#F3F1EC;font-family:'Pretendard Variable',Pretendard,system-ui,sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all}
    *{box-sizing:border-box}
    a{color:#F3F1EC}a:hover{color:#F05A24}
    ::selection{background:#F05A24;color:#090909}
  </style>
  <script src="./image-slot.js"></script>
</helmet>
<dc-import name="SiteNav" active="case" hint-size="100%,0px"></dc-import>

<section data-screen-label="ARCHIVE Hero" style="padding:clamp(120px,13vw,180px) clamp(20px,4vw,56px) clamp(56px,6vw,96px);border-bottom:1px solid #1B1B1B">
  <div style="max-width:1440px;margin:0 auto;display:flex;flex-direction:column;gap:clamp(24px,2.6vw,36px)">
    <div style="position:relative;display:grid;grid-template-columns:1fr auto auto;gap:clamp(16px,2.4vw,32px);padding-bottom:14px;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.16em">
      <span data-reveal="fade" data-delay="200" style="color:#F05A24">03 — ARCHIVE</span>
      <span data-reveal="fade" data-delay="300" style="color:#AAA7A1">작업 사례</span>
      <span data-reveal="fade" data-delay="400" style="color:#AAA7A1">03 / 06</span>
      <span data-reveal="line" style="position:absolute;left:0;right:0;bottom:0;height:1px;background:#F05A24"></span>
    </div>
    <h1 style="margin:clamp(8px,1.6vw,24px) 0 0;font-size:clamp(52px,9.6vw,124px);font-weight:800;line-height:.92;letter-spacing:-.055em;overflow:hidden;padding:0 .1em .14em 0;margin-bottom:-.1em"><span data-reveal="clip" data-delay="400" style="display:block">ARCHIVE<span style="color:#F05A24">.</span></span></h1>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:clamp(24px,4vw,56px);align-items:end">
      <p data-reveal="up" data-delay="700" style="margin:0;font-size:clamp(20px,2vw,28px);font-weight:700;line-height:1.4;letter-spacing:-.02em">시작 상태부터 작업 범위까지,<br>같은 비율로 기록합니다.</p>
      <div data-reveal="up" data-delay="800" style="display:grid">
        <p style="margin:0;font-size:14px;line-height:1.7;color:#AAA7A1;max-width:380px;justify-self:end">모든 사진은 4:5 동일 비율, 같은 조건에서 비교합니다. 결과는 피부와 생활습관 등 개인차가 있을 수 있습니다.</p>
      </div>
    </div>
  </div>
</section>

<div style="position:sticky;top:68px;z-index:20;background:rgba(9,9,9,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid #1B1B1B;border-bottom:1px solid #1B1B1B;padding:0 clamp(20px,4vw,56px)">
  <div style="max-width:1440px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:16px;overflow-x:auto;scrollbar-width:none">
    <div style="display:flex;gap:0">
      <sc-for list="{{ filters }}" as="f" hint-placeholder-count="5">
        <button onClick="{{ f.pick }}" style="appearance:none;cursor:pointer;background:none;border:0;border-bottom:2px solid {{ f.line }};height:56px;padding:0 18px;color:{{ f.color }};font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.16em;white-space:nowrap;transition:color .25s">{{ f.label }} <span style="color:#F05A24">{{ f.count }}</span></button>
      </sc-for>
    </div>
    <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;color:#AAA7A1;white-space:nowrap">{{ shown }} CASES</span>
  </div>
</div>

<section data-screen-label="Archive" style="padding:clamp(48px,5vw,80px) clamp(20px,4vw,56px) clamp(96px,11vw,168px)">
  <div style="max-width:1440px;margin:0 auto;display:flex;flex-direction:column">
    <sc-for list="{{ list }}" as="c" hint-placeholder-count="4">
      <article style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:clamp(24px,4vw,64px);padding:clamp(40px,4vw,64px) 0;border-top:1px solid #292929">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
          <div style="display:flex;flex-direction:column;gap:8px">
            <div style="position:relative;aspect-ratio:4/5;background:#111;color:#AAA7A1"><image-slot id="{{ c.b }}" shape="rect" placeholder="BEFORE — 4:5"></image-slot></div>
            <span style="font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.16em;color:#AAA7A1">BEFORE</span>
          </div>
          <div style="display:flex;flex-direction:column;gap:8px">
            <div style="position:relative;aspect-ratio:4/5;background:#111;color:#AAA7A1"><image-slot id="{{ c.a }}" shape="rect" placeholder="AFTER — 4:5"></image-slot></div>
            <span style="font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.16em;color:#F05A24">AFTER</span>
          </div>
        </div>
        <div style="display:flex;flex-direction:column;gap:22px">
          <div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px">
            <span style="font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.16em;color:#F05A24">CASE {{ c.no }}</span>
            <span style="font-size:clamp(32px,3.4vw,52px);font-weight:800;letter-spacing:-.04em;line-height:1">{{ c.area }}</span>
          </div>
          <p style="margin:0;font-size:clamp(20px,1.8vw,26px);font-weight:700;line-height:1.45;letter-spacing:-.02em;white-space:pre-line">{{ c.head }}</p>
          <dl style="margin:auto 0 0;display:flex;flex-direction:column">
            <sc-for list="{{ c.fields }}" as="f" hint-placeholder-count="4">
              <div style="display:grid;grid-template-columns:110px 1fr;gap:16px;padding:12px 0;border-top:1px solid #1B1B1B;font-size:14px;line-height:1.6">
                <dt style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;color:#AAA7A1;padding-top:2px">{{ f.k }}</dt>
                <dd style="margin:0">{{ f.v }}</dd>
              </div>
            </sc-for>
          </dl>
        </div>
      </article>
    </sc-for>
  </div>
</section>

<section data-screen-label="Case CTA" style="padding:0 clamp(12px,2vw,32px) clamp(12px,2vw,32px)">
  <div style="border:1px solid #F05A24;padding:clamp(48px,7vw,112px) clamp(20px,5vw,96px);display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:32px">
    <p style="margin:0;font-size:clamp(28px,3.4vw,52px);font-weight:800;line-height:1.2;letter-spacing:-.04em">비슷한 고민이 있다면,<br>사진으로 먼저 확인해 보세요.</p>
    <a data-magnetic="" href="http://pf.kakao.com/_BPxoxln" target="_blank" rel="noopener" style="display:flex;align-items:center;gap:14px;height:60px;padding:0 28px;background:#F05A24;color:#090909;text-decoration:none;font-size:16px;font-weight:700" style-hover="background:#C94318;color:#090909">카카오톡으로 상담하기 →</a>
  </div>
</section>
<dc-import name="SiteFooter" hint-size="100%,320px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { f: 'ALL' };
  componentDidMount() { import('./motion.js').then(m => { this.cleanup = m.initMotion(); }); }
  componentWillUnmount() { this.cleanup && this.cleanup(); }
  renderVals() {
    const raw = [
      ['CROWN', '정수리가 비어 보이는 범위만\n무조건 진하게 채우지 않았습니다.', '정수리 중심부 두피 노출', '남아 있는 모발 위치와 노출 범위', '주변 모발과 연결되는 밀도', '정수리 중심 및 주변 경계'],
      ['HAIRLINE', '라인을 앞으로 당기기보다\n얼굴에 맞는 선을 먼저 찾았습니다.', 'M자 주변 라인 후퇴', '얼굴 비율과 잔모 방향', '앞쪽은 낮게, 뒤로 갈수록 밀도', '헤어라인 및 M자 주변'],
      ['PART', '가르마 선만\n진하게 덮지 않았습니다.', '가르마 폭이 넓어 보임', '평소 가르마 방향과 양쪽 밀도', '선 중심의 점진적 밀도', '가르마 라인 주변'],
      ['SHAVED', '삭발 상태에서\n균일한 인상을 기준으로 잡았습니다.', '부위별 밀도 차이', '두상 형태와 모근 색', '전체 균일한 톤', '두상 전체'],
      ['CROWN', '가마 방향을 따라\n밀도가 흩어지도록 설계했습니다.', '가마 주변 노출', '모발이 퍼지는 방향', '가마 흐름을 따른 분산', '가마 주변'],
      ['HAIRLINE', '정면보다 측면에서\n자연스러운지를 먼저 확인했습니다.', '양쪽 M자 비대칭', '좌우 라인 차이', '좌우 균형을 맞춘 라인', 'M자 양측'],
      ['PART', '가르마를 바꿔도\n어색하지 않도록 범위를 넓혔습니다.', '가르마 주변 노출', '가르마 방향 변경 여부', '양방향을 고려한 밀도', '가르마 및 양측'],
      ['SHAVED', '기존 SMP의 색 차이를\n먼저 맞추는 방향으로 상담했습니다.', '기존 SMP 부위별 색 차이', '남아 있는 색과 퍼짐 정도', '주변 톤에 맞춘 블렌딩', '기존 작업 부위 중심'],
    ];
    const all = raw.map((r, i) => ({
      no: String(i + 1).padStart(3, '0'), area: r[0], head: r[1],
      fields: [['시작 상태', r[2]], ['상담 포인트', r[3]], ['디자인 방향', r[4]], ['작업 범위', r[5]]].map(([k, v]) => ({ k, v })),
      b: `archive-${i + 1}-before`, a: `archive-${i + 1}-after`,
    }));
    const list = this.state.f === 'ALL' ? all : all.filter(c => c.area === this.state.f);
    const keys = ['ALL', 'CROWN', 'HAIRLINE', 'PART', 'SHAVED'];
    return {
      list, shown: String(list.length).padStart(2, '0'),
      filters: keys.map(k => ({
        label: k, count: String(k === 'ALL' ? all.length : all.filter(c => c.area === k).length).padStart(2, '0'),
        color: this.state.f === k ? '#F3F1EC' : '#AAA7A1', line: this.state.f === k ? '#F05A24' : 'transparent',
        pick: () => this.setState({ f: k }),
      })),
    };
  }
}
</script>
</body>
</html>
